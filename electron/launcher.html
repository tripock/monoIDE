<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; style-src 'self'; script-src 'self';"
		/>
		<title>Mono IDE</title>
		<link rel="stylesheet" href="launcher.css" />
	</head>
	<body>
		<main>
			<h1>mono ide</h1>
			<p class="sub">local editor · notion ai agent · mcp · built-in notion2api</p>

			<button id="pick" class="primary">Choose project folder…</button>

			<section id="recents-box" hidden>
				<h2>recent</h2>
				<ul id="recents"></ul>
			</section>

			<section id="boot" hidden>
				<div class="steps" id="steps"></div>
				<pre id="log"></pre>
			</section>

			<section id="failure" hidden>
				<h2>startup failed</h2>
				<p class="sub" id="failure-summary"></p>
				<ul id="failure-list"></ul>
				<p class="sub" id="failure-path"></p>
				<pre id="report"></pre>
				<div class="actions">
					<button id="retry">Retry</button>
					<button id="open-log">Open log file</button>
					<button id="copy-report">Copy report</button>
					<button id="back">Choose another folder</button>
				</div>
			</section>

			<p id="error" hidden></p>
		</main>
		<script src="launcher.js"></script>
	</body>
</html>
